name: sentinel-stream
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pip
  # Note: libpcap-dev system package required for pypcap
  # Run: bash scripts/install_system_deps.sh
  # Or manually: sudo apt-get install libpcap-dev (Ubuntu/Debian)
  
  # Core Dependencies
  - pytorch>=2.0.0
  - numpy>=1.24.0
  - pandas>=2.0.0
  - scikit-learn>=1.3.0
  
  # Data Processing
  - redis-py>=5.0.0
  - h5py>=3.9.0
  
  # ML & Explainability
  - xgboost>=2.0.0
  
  # API & Web
  - pip:
    # PyTorch Geometric (not in conda)
    - torch-geometric>=2.3.0
    # Data Processing (some not in conda)
    - scapy>=2.5.0
    # Note: pypcap requires libpcap-dev system package
    # Install with: sudo apt-get install libpcap-dev (Ubuntu/Debian)
    #              or: brew install libpcap (macOS)
    # If libpcap-dev is not available, scapy can be used as fallback
    - pypcap>=1.2.3; sys_platform != "win32"
    # ML & Explainability
    - shap>=0.42.0
    # API & Web
    - fastapi>=0.104.0
    - uvicorn[standard]>=0.24.0
    - pydantic>=2.4.0
    - websockets>=12.0
    # Utilities
    - python-dotenv>=1.0.0
    - pyyaml>=6.0.1
    - tqdm>=4.66.0
    - matplotlib>=3.7.0
    - seaborn>=0.12.0
    # Testing
    - pytest>=7.4.0
    - pytest-asyncio>=0.21.0
    - pytest-cov>=4.1.0
    # Development
    - black>=23.10.0
    - flake8>=6.1.0
    - mypy>=1.6.0

