name: sentinel-stream
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pip
  - pytorch>=2.0.0
  - numpy>=1.24.0
  - pandas>=2.0.0
  - scikit-learn>=1.3.0
  - redis-py>=5.0.0
  - h5py>=3.9.0
  - xgboost>=2.0.0
  - pip:
    - torch-geometric>=2.3.0
    - scapy>=2.5.0
    - shap>=0.42.0
    - fastapi>=0.104.0
    - uvicorn[standard]>=0.24.0
    - pydantic>=2.4.0
    - websockets>=12.0
    - python-dotenv>=1.0.0
    - pyyaml>=6.0.1
    - tqdm>=4.66.0
    - matplotlib>=3.7.0
    - seaborn>=0.12.0
    - pytest>=7.4.0
    - pytest-asyncio>=0.21.0
    - pytest-cov>=4.1.0
    - black>=23.10.0
    - flake8>=6.1.0
    - mypy>=1.6.0
# Optional packet capture: pip install '.[pcap]' after installing libpcap-dev
