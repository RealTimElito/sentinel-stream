# Temporal Graph Network Configuration

model:
  name: "tgn"
  node_dim: 64
  edge_dim: 32
  time_dim: 16
  memory_dim: 64
  message_dim: 64
  num_layers: 2
  num_heads: 4
  dropout: 0.1

training:
  batch_size: 64
  learning_rate: 0.001
  num_epochs: 100
  early_stopping_patience: 10
  validation_split: 0.2
  pretrain_epochs: 50
  finetune_epochs: 50

data:
  dataset: "CIC-IDS2017"
  data_path: "./data"
  sequence_length: 100
  time_window: 60  # seconds
  min_flow_duration: 0.1  # seconds
  max_flow_duration: 3600  # seconds

features:
  use_inter_arrival: true
  use_packet_sizes: true
  use_flow_entropy: true
  normalize: true

inference:
  threshold: 0.5
  batch_size: 32
  max_queue_size: 1000

